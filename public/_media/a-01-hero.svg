<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plate A.01 — a compass-rose floor plan with six radiating arms.">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#EFE7D2" stop-opacity="1"/>
      <stop offset="55%" stop-color="#E8C7BC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F7F5F0" stop-opacity="1"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0E0F12" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#F7F5F0"/>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- Compass-rose floor plan: six radiating arms (A-F) from a center -->
  <g stroke="#0E0F12" stroke-width="1.25" fill="none" stroke-opacity="0.55" transform="translate(960 540)">
    <circle r="320"/>
    <circle r="180"/>
    <circle r="40"/>
    <line x1="0" y1="-320" x2="0" y2="-180"/>
    <line x1="277" y1="-160" x2="156" y2="-90"/>
    <line x1="277" y1="160" x2="156" y2="90"/>
    <line x1="0" y1="320" x2="0" y2="180"/>
    <line x1="-277" y1="160" x2="-156" y2="90"/>
    <line x1="-277" y1="-160" x2="-156" y2="-90"/>
    <circle cx="0" cy="-260" r="3" fill="#B23A1F" stroke="none"/>
    <circle cx="225" cy="-130" r="3" fill="#B23A1F" stroke="none"/>
    <circle cx="225" cy="130" r="3" fill="#B23A1F" stroke="none"/>
    <circle cx="0" cy="260" r="3" fill="#B23A1F" stroke="none"/>
    <circle cx="-225" cy="130" r="3" fill="#B23A1F" stroke="none"/>
    <circle cx="-225" cy="-130" r="3" fill="#B23A1F" stroke="none"/>
    <text x="0" y="-260" font-family="serif" font-style="italic" font-size="22" fill="#0E0F12" text-anchor="middle" dy="-12">A</text>
    <text x="225" y="-130" font-family="serif" font-style="italic" font-size="22" fill="#0E0F12" text-anchor="middle" dy="-12">B</text>
    <text x="225" y="130" font-family="serif" font-style="italic" font-size="22" fill="#0E0F12" text-anchor="middle" dy="22">C</text>
    <text x="0" y="260" font-family="serif" font-style="italic" font-size="22" fill="#0E0F12" text-anchor="middle" dy="22">D</text>
    <text x="-225" y="130" font-family="serif" font-style="italic" font-size="22" fill="#0E0F12" text-anchor="middle" dy="22">E</text>
    <text x="-225" y="-130" font-family="serif" font-style="italic" font-size="22" fill="#0E0F12" text-anchor="middle" dy="-12">F</text>
  </g>

  <g font-family="serif" fill="#0E0F12" fill-opacity="0.5">
    <text x="120" y="120" font-size="14" letter-spacing="3.4">PLATE</text>
    <text x="120" y="158" font-size="34" font-style="italic" fill="#B23A1F">A.01</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plate F.40 — six horizontal layers stacked vertically, each labeled A through F, threaded by single vermilion dots that connect them.">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#EFE7D2" stop-opacity="1"/>
      <stop offset="60%" stop-color="#E8C7BC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F7F5F0" stop-opacity="1"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0E0F12" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#F7F5F0"/>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- Six horizontal layers; each is a long thin rectangle with a label -->
  <g stroke="#0E0F12" stroke-width="1" fill="none" stroke-opacity="0.55">
    <line x1="380" y1="240" x2="1540" y2="240"/>
    <line x1="380" y1="360" x2="1540" y2="360"/>
    <line x1="380" y1="480" x2="1540" y2="480"/>
    <line x1="380" y1="600" x2="1540" y2="600"/>
    <line x1="380" y1="720" x2="1540" y2="720"/>
    <line x1="380" y1="840" x2="1540" y2="840"/>
  </g>
  <g font-family="serif" font-style="italic" font-size="22" fill="#0E0F12" fill-opacity="0.65">
    <text x="320" y="246" text-anchor="end">A</text>
    <text x="320" y="366" text-anchor="end">B</text>
    <text x="320" y="486" text-anchor="end">C</text>
    <text x="320" y="606" text-anchor="end">D</text>
    <text x="320" y="726" text-anchor="end">E</text>
    <text x="320" y="846" text-anchor="end">F</text>
  </g>
  <!-- Vermilion thread connecting the layers -->
  <g fill="#B23A1F" stroke="none">
    <circle cx="540" cy="240" r="5"/>
    <circle cx="720" cy="360" r="5"/>
    <circle cx="900" cy="480" r="5"/>
    <circle cx="1080" cy="600" r="5"/>
    <circle cx="1260" cy="720" r="5"/>
    <circle cx="1440" cy="840" r="5"/>
  </g>
  <g stroke="#B23A1F" stroke-width="1" fill="none" stroke-opacity="0.6">
    <path d="M 540 240 L 720 360 L 900 480 L 1080 600 L 1260 720 L 1440 840"/>
  </g>

  <g font-family="serif" fill="#0E0F12" fill-opacity="0.5">
    <text x="120" y="120" font-size="14" letter-spacing="3.4">PLATE</text>
    <text x="120" y="158" font-size="34" font-style="italic" fill="#B23A1F">F.40</text>
  </g>
</svg>
